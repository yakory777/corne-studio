CONFIG_CORNE_TOOL=y

# USB COM-порт
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Свой экран статуса (если CONFIG_ZMK_DISPLAY=y)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_8=y

# LVGL для своего экрана — как у встроенного экрана ZMK
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
