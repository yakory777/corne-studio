# OLED-дисплей
CONFIG_ZMK_DISPLAY=y

# RGB-подсветка (без EXT_POWER: иначе выключение подсветки обесточивает и экран)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30

# Имя в Bluetooth одинаковое, какая бы половина ни была главной
CONFIG_ZMK_KEYBOARD_NAME="Corne"
